server:
  port: 8083
spring:
  application:
    name: customer-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:customer-domain/customer-service/.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    default-schema: customer
    schemas: customer
    create-schemas: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: customer

logging:
  file:
    name: ${STEPFLOW_LOG_DIR:../temp/stepflow-logs}/${spring.application.name}.json
  structured:
    format:
      file: ecs
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

event:
  outbox:
    table-name: customer.customer_event
    domain-type: CUSTOMER
    default-topic: customer-trigger
    publisher:
      enabled: ${EVENT_OUTBOX_PUBLISHER_ENABLED:true}
      batch-size: 20
      poll-interval: 5s
      send-timeout: 10s
